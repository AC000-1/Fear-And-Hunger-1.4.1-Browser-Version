<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="apple-mobile-web-app-capable" content="yes">
        <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
        <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
        <link rel="icon" href="icon/icon.png" type="image/png">
        <link rel="apple-touch-icon" href="icon/icon.png">
        <link rel="stylesheet" type="text/css" href="fonts/gamefont.css">
        <title>Fear &amp; Hunger</title>
        <style>
        html, body {
          margin: 0;
          padding: 0;
          height: 100%;
          overflow: hidden;
          background: black;
        }

        #mobile-controls {
          display: none;
        }

        @media (pointer: coarse), (max-width: 900px) {

          #mobile-controls {
            display: block;
            position: fixed;
            inset: 0;
            z-index: 99999;
            pointer-events: none;
            user-select: none;
          }

          .ctrl-btn {
            position: absolute;
            width: 64px;
            height: 64px;
            border: none;
            border-radius: 14px;
            background: rgba(0,0,0,0.45);
            color: white;
            font-size: 22px;
            pointer-events: auto;
          }

          .ctrl-small {
            width: 54px;
            height: 54px;
            font-size: 16px;
          }

          canvas {
            touch-action: none;
          }

          /* D-Pad */
          #up    { left: 90px;  bottom: 170px; }
          #left  { left: 20px;  bottom: 100px; }
          #down  { left: 90px;  bottom: 100px; }
          #right { left: 160px; bottom: 100px; }

          /* Action buttons */
          #zBtn      { right: 120px; bottom: 150px; }
          #xBtn      { right: 40px;  bottom: 100px; }
          #shiftBtn  { right: 200px; bottom: 90px; }
          #cBtn      { right: 280px; bottom: 90px; }
          #wBtn      { right: 360px; bottom: 90px; }

          /* Fullscreen button */
          #fsBtn     { right: 40px; top: 20px; }
        }
        </style>
    </head>
    <body style="background-color: black">
        <div id="mobile-controls">

          <!-- Movement -->
          <button class="ctrl-btn" id="up">↑</button>
          <button class="ctrl-btn" id="left">←</button>
          <button class="ctrl-btn" id="down">↓</button>
          <button class="ctrl-btn" id="right">→</button>

          <!-- Main -->
          <button class="ctrl-btn" id="zBtn">Z</button>
          <button class="ctrl-btn" id="xBtn">X</button>

          <!-- Utility -->
          <button class="ctrl-btn ctrl-small" id="shiftBtn">Shift</button>
          <button class="ctrl-btn ctrl-small" id="cBtn">C</button>
          <button class="ctrl-btn ctrl-small" id="wBtn">W</button>

          <!-- Fullscreen -->
          <button class="ctrl-btn ctrl-small" id="fsBtn">⛶</button>

        </div>
        <script type="text/javascript" src="js/libs/pixi.js"></script>
        <script type="text/javascript" src="js/libs/pixi-tilemap.js"></script>
        <script type="text/javascript" src="js/libs/pixi-picture.js"></script>
        <script type="text/javascript" src="js/libs/fpsmeter.js"></script>
        <script type="text/javascript" src="js/libs/lz-string.js"></script>
        <script type="text/javascript" src="js/libs/iphone-inline-video.browser.js"></script>
        <script type="text/javascript" src="js/rpg_core.js"></script>
        <script type="text/javascript" src="js/rpg_managers.js"></script>
        <script type="text/javascript" src="js/rpg_objects.js"></script>
        <script type="text/javascript" src="js/rpg_scenes.js"></script>
        <script type="text/javascript" src="js/rpg_sprites.js"></script>
        <script type="text/javascript" src="js/rpg_windows.js"></script>
        <script type="text/javascript" src="js/plugins.js"></script>
        <script type="text/javascript" src="js/main.js"></script>

        <script>
        /* ── Helpers ── */
        function press(key)   { if (Input._currentState) Input._currentState[key] = true;  }
        function release(key) { if (Input._currentState) Input._currentState[key] = false; }

        /* ── Mobile buttons ── */
        function bindButton(id, key) {
          const btn = document.getElementById(id);
          if (!btn) return;

          const start = (e) => { e.preventDefault(); press(key); };
          const end   = (e) => { e.preventDefault(); release(key); };

          btn.addEventListener("touchstart",  start, { passive: false });
          btn.addEventListener("touchend",    end,   { passive: false });
          btn.addEventListener("touchcancel", end,   { passive: false });
          btn.addEventListener("mousedown",   start);
          btn.addEventListener("mouseup",     end);
          btn.addEventListener("mouseleave",  end);
        }

        bindButton("up",       "up");
        bindButton("left",     "left");
        bindButton("down",     "down");
        bindButton("right",    "right");
        bindButton("zBtn",     "ok");
        bindButton("xBtn",     "escape");
        bindButton("shiftBtn", "shift");
        bindButton("cBtn",     "control");
        bindButton("wBtn",     "pagedown");

        /* ── WASD keyboard support for PC ──
           RPG Maker MV maps keyCodes via Input.keyMapper:
             37=left, 38=up, 39=right, 40=down
           We remap W/A/S/D by adding them to keyMapper after the engine loads,
           then also hook keyMapper directly so Input picks them up natively.    */

        // W=87, A=65, S=83, D=68  →  arrow keyCodes
        const wasdKeyCodeMap = {
          87: 38, // W → Up    (↑)
          65: 37, // A → Left  (←)
          83: 40, // S → Down  (↓)
          68: 39  // D → Right (→)
        };

        // Wait for RPG Maker to finish setting up Input.keyMapper, then patch it
        function patchWASD() {
          if (typeof Input === "undefined" || !Input.keyMapper) {
            setTimeout(patchWASD, 200);
            return;
          }
          // Add WASD keyCodes pointing to the same action strings as arrow keys
          Input.keyMapper[87] = "up";
          Input.keyMapper[65] = "left";
          Input.keyMapper[83] = "down";
          Input.keyMapper[68] = "right";
        }
        patchWASD();

        /* ── Fullscreen ──
           iOS Safari (including 2026) does NOT support the Fullscreen API.
           Best we can do:
             1. If added to Home Screen (standalone), the browser chrome is already gone.
             2. In Safari browser: scroll to hide the address bar + set body to 100vh trick.
             3. On other browsers (Chrome Android, desktop): use standard Fullscreen API.       */

        const fsBtn = document.getElementById("fsBtn");

        const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream
                   || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1); // iPadOS 13+

        const isStandalone = window.navigator.standalone === true
                          || window.matchMedia("(display-mode: standalone)").matches;

        function iosHideChrome() {
          // Force body taller than viewport so scrolling is possible, then snap back
          document.body.style.height = (window.screen.height + 100) + "px";
          window.scrollTo(0, 1);
          setTimeout(() => {
            document.body.style.height = "100%";
            window.scrollTo(0, 0);
          }, 400);
          fsBtn.textContent = "✕";
        }

        function enterFullscreen() {
          const el = document.documentElement;
          const req = el.requestFullscreen
                   || el.webkitRequestFullscreen
                   || el.mozRequestFullScreen
                   || el.msRequestFullscreen;
          if (req) req.call(el);
          fsBtn.textContent = "✕";
        }

        function exitFullscreen() {
          const ex = document.exitFullscreen
                  || document.webkitExitFullscreen
                  || document.mozCancelFullScreen
                  || document.msExitFullscreen;
          if (ex) ex.call(document);
          fsBtn.textContent = "⛶";
        }

        fsBtn.addEventListener("click", () => {
          if (isIOS) {
            if (isStandalone) {
              // Already fullscreen in standalone — nothing to do, show user tip
              fsBtn.textContent = "✓";
              setTimeout(() => { fsBtn.textContent = "⛶"; }, 1500);
            } else {
              iosHideChrome();
            }
            return;
          }
          const isFs = document.fullscreenElement
                    || document.webkitFullscreenElement
                    || document.mozFullScreenElement
                    || document.msFullscreenElement;
          isFs ? exitFullscreen() : enterFullscreen();
        });

        // Sync icon on fullscreen change (non-iOS)
        ["fullscreenchange", "webkitfullscreenchange", "mozfullscreenchange", "MSFullscreenChange"]
          .forEach(evt => document.addEventListener(evt, () => {
            const isFs = document.fullscreenElement
                      || document.webkitFullscreenElement
                      || document.mozFullScreenElement
                      || document.msFullscreenElement;
            fsBtn.textContent = isFs ? "✕" : "⛶";
          }));
        </script>
    </body>
</html>
